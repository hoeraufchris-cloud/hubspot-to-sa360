name: HubSpot to SA360 Offline Upload

on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * *'

concurrency:
  group: hubspot-to-sa360-daily
  cancel-in-progress: true

jobs:
  run-sync:
    runs-on: ubuntu-latest

    env:
      HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT_FILE: ${{ github.workspace }}/service_account.json

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rebuild service account file
        run: |
          cat <<'EOF2' > service_account.json
          ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          EOF2

      - name: Run SA360 offline conversion upload
        run: python hubspot_sa360_dry_run.py

      - name: Commit updated upload log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add uploaded_conversions.json

          if git diff --cached --quiet; then
            echo "No upload log changes to commit"
          else
            git commit -m "Update uploaded conversions log"
            git push
          fi
